[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fath"
version = "0.1.0"
description = "Fath Autopilot — repository foundation (TASK-001)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic",
    "asyncpg",
    "redis",
    "pyyaml",
    "psycopg[binary]",
    "greenlet",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fath"]

[tool.hatch.build.targets.sdist]
only-include = ["src/fath", "README.md"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
src = ["src", "scripts"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["src/fath/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: requires local Postgres/Redis stack",
]
